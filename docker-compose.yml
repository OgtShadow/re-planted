services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: replanted_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - replanted-network
    restart: unless-stopped

  postgres_db:
    image: postgres:16-alpine
    container_name: replanted_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - replanted-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./apps/Server
      dockerfile: Dockerfile
    container_name: replanted_app
    ports:
      - "${APP_PORT}:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres_db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - TelemetryCollector__BaseUrl=http://app_client:8080
      - TelemetryCollector__SensorsPath=/api/client-server/controllers/telemetry/current
      - TelemetryCollector__PollingIntervalSeconds=15
      - TelemetryCollector__RetentionDays=30
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - replanted-network

  app_client:
    build:
      context: ./apps/ClientServer
      dockerfile: Dockerfile
    container_name: replanted_app_client
    ports:
      - "${APP_CLIENT_PORT}:8080"
    environment:
      - MainServerApi__BaseUrl=http://app:8080
      - MainServerApi__PlantsPath=/api/users/{clientId}/plants
      - MockDeviceApi__BaseUrl=http://sensor-mock:8085
      - MockDeviceApi__SensorsPath=/sensors
      - MockDeviceApi__PumpCommandPath=/command/pump
      - IoTController__ClientIds__0=1
      - IoTController__ClientIds__1=2
      - IoTController__ClientIds__2=3
      - IoTController__PollingIntervalSeconds=15
      - IoTController__PumpRunSeconds=2
      - IoTController__SoakTimeSeconds=60
      - IoTController__LowWaterThresholdCm=2
      - IoTController__MoistureThresholdBufferPercent=5
      - Mqtt__Enabled=true
      - Mqtt__BrokerHost=mosquitto
      - Mqtt__BrokerPort=1883
      - Mqtt__ClientId=re-planted-client-server
      - Mqtt__TelemetryTopicFilter=replanted/telemetry/+/+
      - Mqtt__CommandsTopicTemplate=replanted/commands/{deviceId}
      - Mqtt__KeepAliveSeconds=30
      - Mqtt__ReconnectDelaySeconds=5
      - Mqtt__QosLevel=1
      - Jwt__Key=dev-only-super-secret-key-change-me-please-12345
      - Jwt__Issuer=re-planted-server
      - Jwt__Audience=re-planted-client
    depends_on:
      app:
        condition: service_started
      postgres_db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - replanted-network
    restart: unless-stopped

  client:
    build:
      context: ./apps/Client
      dockerfile: Dockerfile
      target: dev
    container_name: replanted-client
    depends_on:
      - app
    ports:
      - "${CLIENT_PORT}:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_PORT=5173
    volumes:
      - ./apps/Client:/app
      - /app/node_modules
    networks:
      - replanted-network
    restart: unless-stopped

  sensor-mock:
    build:
      context: ./apps/ArtificialEsp
      dockerfile: Dockerfile
    container_name: replanted-sensor-mock
    ports:
      - "${SENSOR_MOCK_PORT}:8085"
    restart: unless-stopped
    networks:
      - replanted-network

networks:
  replanted-network:
    driver: bridge

volumes:
  postgres_data: